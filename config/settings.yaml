# Defaults for bt_orchestrator (Tradeq I5). Every value can be overridden through the environment
# with the BT_ prefix and "__" as the nested delimiter, e.g. BT_SERVICE__PORT=9606.
# TRADEQ_DATA_DIR (the platform data root) is read from the environment or .env.

service:
  host: 127.0.0.1
  port: 8606

logging:
  level: INFO
  json_output: false

paths:
  subtree: backtest-orchestrator      # this project's folder under TRADEQ_DATA_DIR
  reports: reports
  models: models/fills
  synthetic: synthetic
  trials: trials
  sim_fake: sim-fake

# Sibling services (contracts 6.1, 6.3, 6.5). "mode" chooses HTTP or the offline fallback.
ledger:
  base_url: http://127.0.0.1:8601
  mode: auto                          # http | inbox | auto (HTTP, falling back to the inbox)
  timeout_s: 5.0
  inbox_subdir: research-ledger/inbox
  source: i5
  family_template: "i5/{strategy}/{universe}"
  strategy_id_template: "i5-{strategy}-{universe}"
  actor:
    kind: human
    id: bt-cli
  max_inline_returns: 20000           # longer return series go to Parquet (returns_path)
  tags: [i5]

pit:
  base_url: http://127.0.0.1:8603
  mode: local                         # http | local
  timeout_s: 30.0
  query_mode: research
  format: arrow                       # arrow (int64 ns times) | json (ISO-8601 times)
  # Columns that I2's JSON format renders as ISO-8601 strings and the client turns back into int64 ns.
  timestamp_columns: [ts, ts_exchange, ts_local, valid_time, knowledge_time]
  # Where bars come from: a bars dataset (the local stand-in has one), or I2's tape.trades aggregated
  # to bars here (the shipped I2 has no bars dataset, so use "trades" with mode: http).
  bars_source: dataset                # dataset | trades
  datasets:
    bars: bars_1m
    trades: tape.trades               # I2 dataset names (point-in-time-store config/datasets.yaml)
    book: tape.book_delta

local_source:
  # Datasets served offline by the local Parquet source, relative to this project's data subtree.
  datasets:
    bars_1m:
      path: synthetic/market/bars_1m.parquet
      keys: [symbol, ts]
    tape.trades:
      path: synthetic/market/trades.parquet
      keys: [symbol, trade_id]
    tape.book_delta:
      path: synthetic/market/book_delta.parquet
      keys: [symbol, ts_local, side, price]
  valid_time_column: valid_time
  knowledge_time_column: knowledge_time

sim:
  base_url: http://127.0.0.1:8609
  mode: fake                          # http | fake (in-process stand-in for S3)
  timeout_s: 120.0
  scenario: thin-book-stress
  seed: 7
  max_duration_s: 172800
  # Scenarios offered by the in-process fake; multipliers apply to the synthetic market spec.
  fake_scenarios:
    baseline:
      vol_multiplier: 1.0
      spread_multiplier: 1.0
      depth_multiplier: 1.0
      trade_rate_multiplier: 1.0
    thin-book-stress:
      vol_multiplier: 1.6
      spread_multiplier: 2.0
      depth_multiplier: 0.4
      trade_rate_multiplier: 0.7

fills:
  root_subdir: shadow-exchange/fills  # contract 6.4 export, relative to TRADEQ_DATA_DIR
  orders_subdir: shadow-exchange/orders  # optional extension: unfilled limit orders

market:
  # MOEX TQBR stocks are the default (spec revision 2026-10-29). The synthetic crypto market of the
  # first version stays as an optional profile: BT_PROFILE=crypto (config/profiles/crypto.yaml).
  venue: moex-tbank
  bar_interval_s: 60
  # The synthetic world trades the MOEX main session only, 10:00 to 18:40 Moscow time (UTC+3, no DST),
  # on weekdays; exchange holidays are not modelled. A year is 252 sessions of 31200 s.
  session: {open_utc: "07:00", close_utc: "15:40", weekdays: [0, 1, 2, 3, 4]}
  seconds_per_year: 7862400
  seconds_per_day: 31200
  # TMOS (T-Capital MOEX index ETF) trades at 0% on T-Invest, so the zero-fee path runs end to end.
  default_universe: [SBER-RUB-TQBR, TMOS-RUB-TQBR]
  instruments:
    # lot_size is in shares, as in the I1 tape; lots and ticks match I1's and I9's settings.
    SBER-RUB-TQBR: {base: SBER, quote: RUB, tick_size: 0.01, lot_size: 1, price_precision: 2, size_precision: 0}
    GAZP-RUB-TQBR: {base: GAZP, quote: RUB, tick_size: 0.01, lot_size: 10, price_precision: 2, size_precision: 0}
    LKOH-RUB-TQBR: {base: LKOH, quote: RUB, tick_size: 0.5, lot_size: 1, price_precision: 1, size_precision: 0}
    TMOS-RUB-TQBR:
      {base: TMOS, quote: RUB, tick_size: 0.01, lot_size: 1, price_precision: 2, size_precision: 0,
       instrument_uid: 8a6af80e-1db8-4264-944d-d70e4b715341}

costs:
  # Default rates (share of trade value per fill) for venues without a schedule below: the optional
  # synthetic crypto market (venue SYNTH, BT_PROFILE=crypto).
  maker_fee: 0.0002
  taker_fee: 0.0005
  venues:
    # MOEX: T-Invest basic tariff per user, 2026-11-05. 0.25% of trade value per fill, maker and taker
    # alike; 0% for T-Bank's own funds (ETFs managed by T-Capital). Trading is local simulation only.
    # The schedule is keyed by the feed venue, so every MOEX feed gets it.
    moex-tbank: &tinvest_basic
      source: T-Invest basic tariff per user, 2026-11-05
      maker_fee: 0.0025
      taker_fee: 0.0025
      zero_fee_funds:
        maker_fee: 0.0
        taker_fee: 0.0
        # Fallback list (same as I9's, from memory, not checked against T-Bank); I1's reference file
        # (below) is authoritative and is merged in when it exists.
        tickers: [TMOS, TRUR, TGLD, TBRU, TMON, TPAY, TDIV, TITR, TOFZ, TLCB]
        instrument_uids: []
        reference_file: market-tape-recorder/reference/tbank_zero_fee_funds.json
    moex-algopack: *tinvest_basic
    moex-iss: *tinvest_basic

account:
  initial_cash: 1000000.0
  leverage: 10.0

engines:
  nautilus:
    data_mode: bars                   # bars | trades
    trader_id: BT-001
    log_level: ERROR
  hftbacktest:
    exchange: no_partial_fill         # no_partial_fill | partial_fill
    queue_model: power_prob
    queue_power: 2.0
    entry_latency_ns: 5000000
    response_latency_ns: 5000000
    feed_latency_ns: 1000000
    contract_size: 1.0
  vectorbt:
    direction: both

calibration:
  horizon_ns: 60000000000             # a limit order "fills" if it fills within one bar
  vol_window: 50                      # arrival-mid observations in the rolling volatility
  test_fraction: 0.3
  seed: 11
  min_samples: 200
  logistic_c: 1.0
  latency_quantile: 0.5               # latency quantile injected into the tick engine
  max_iter: 1000

metrics:
  ci_level: 0.95
  n_boot: 1000
  block_len: 30
  seed: 2026

ladder:
  levels: [vectorised, event, tick, reactive_sim]
  run_all_levels: false               # true: keep climbing after a failed gate, for diagnostics
  causality_cuts: 3                   # prefix-invariance checks of vectorised targets
  promotion:
    vectorised:
      min_sharpe: 0.5
      min_fills: 10
      max_drawdown: 0.25
    event:
      min_sharpe: 0.3
      min_fills: 10
      max_drawdown: 0.25
      max_sharpe_drop: 2.0
    tick:
      min_sharpe: 0.0
      min_fills: 5
      max_drawdown: 0.3
      max_sharpe_drop: 2.0
    reactive_sim:
      min_sharpe: -1.0
      min_fills: 1
      max_drawdown: 0.4

parity:
  price_rel_tol: 1.0e-6               # relative price tolerance for "identical"
  rounding_ticks: 1.0                 # differences up to this many ticks are rounding
  qty_lots: 1.0                       # quantity differences up to this many lots are rounding
  fee_rel_tol: 1.0e-4
  fee_rounding_abs: 0.01              # fee difference per fill counted as rounding (one kopeck or cent)
  pnl_rel_tol: 1.0e-3                 # relative to initial cash
  timing_window_bars: 2
  max_disagreement_rate: 0.05

sweep:
  objective: sharpe
  random_samples: 20
  seed: 5

walk_forward:
  train_bars: 1440
  test_bars: 480
  step_bars: 480
  fidelity: vectorised

strategies:
  sma_cross:
    defaults:
      fast: 30
      slow: 120
      qty: 1.0
    grid:
      fast: [10, 20, 30, 60]
      slow: [90, 120, 240]
      qty: [1.0]
    ranges:
      fast: [5, 60]
      slow: [80, 300]
      qty: [1.0, 1.0]
  limit_mean_reversion:
    defaults:
      lookback: 20
      entry_z: 1.5
      exit_z: 0.25
      offset_bps: 1.0
      qty: 1.0
      order_ttl_bars: 1
    grid:
      lookback: [10, 20, 40]
      entry_z: [1.0, 1.5, 2.0]
      exit_z: [0.25]
      offset_bps: [0.5, 1.0]
      qty: [1.0]
      order_ttl_bars: [1]
    ranges:
      lookback: [10, 60]
      entry_z: [1.0, 2.5]
      exit_z: [0.0, 0.5]
      offset_bps: [0.0, 3.0]
      qty: [1.0, 1.0]
      order_ttl_bars: [1, 3]

synthetic:
  # MOEX world, calibrated roughly on the I1 tape of 2026-11-05 (ISS trades and T-Bank book snapshots,
  # main session): SBER 292.9 RUB, 1-minute return sd 3.7 bps (0.48 bps per sqrt s), spread 1 to 2
  # ticks, 1.9 trades/s, trades of about 190 shares, about 2900 shares per book level. The global values
  # are SBER's; synthetic.instruments overrides them per symbol.
  seed: 42
  start: "2026-01-05T07:00:00Z"       # a Monday, at the main-session open
  n_bars: 1040                        # two main sessions
  quote_interval_ms: 1000
  initial_price: 292.9
  vol_bps_per_sqrt_s: 0.48
  regime_bars: 240
  trend_bps_per_bar: 0.3
  half_spread_ticks: 1
  max_extra_spread_ticks: 0
  book_levels: 5
  level_size_mean: 2900.0
  trade_rate_per_s: 1.9
  trade_size_mean: 150.0
  feed_latency_ns: 2000000
  fills:
    n_orders: 6000
    limit_share: 0.7
    venue: moex-tbank
    account_id: synthetic-account
    strategy_id: synthetic-fills
    base_hazard_per_s: 0.03
    distance_coef: 0.35               # per bp of distance to touch
    queue_coef: 0.45                  # per log1p(queue ahead)
    vol_coef: 0.8                     # per bp/sqrt(s) of volatility
    order_ttl_s: 300
    max_distance_bps: 10.0
    queue_mean: 3.0
    half_spread_bps: 0.34             # one SBER tick at 293 RUB
    impact_coef_bps: 25.0             # bps per sqrt(participation)
    slippage_noise_bps: 0.3
    latency_median_ns: 4000000
    latency_sigma: 0.35
    qty_mean: 2000.0                  # shares; rounded to whole lots
    order_spacing_s: 12
  instruments:
    # Same day: GAZP 112.7 RUB (a 5% range day), LKOH 6038 RUB. TMOS has no tape yet: its price and
    # activity are assumptions (an index ETF near 7 RUB with a one-tick spread, 14 bps per tick).
    GAZP-RUB-TQBR: {initial_price: 112.7, vol_bps_per_sqrt_s: 1.07, half_spread_ticks: 2,
                    max_extra_spread_ticks: 1, level_size_mean: 11900.0, trade_rate_per_s: 2.8,
                    trade_size_mean: 880.0, fills_qty_mean: 10000.0}
    LKOH-RUB-TQBR: {initial_price: 6038.0, vol_bps_per_sqrt_s: 0.66, half_spread_ticks: 1,
                    max_extra_spread_ticks: 0, level_size_mean: 280.0, trade_rate_per_s: 1.2,
                    trade_size_mean: 18.0, fills_qty_mean: 100.0}
    TMOS-RUB-TQBR: {initial_price: 7.0, vol_bps_per_sqrt_s: 0.45, half_spread_ticks: 0,
                    max_extra_spread_ticks: 0, level_size_mean: 200000.0, trade_rate_per_s: 1.0,
                    trade_size_mean: 3000.0, fills_qty_mean: 50000.0}

reproduce:
  strategies: [sma_cross, limit_mean_reversion]
  parity_strategies: [sma_cross, limit_mean_reversion]
  run_all_levels: true
  sweep_strategy: sma_cross

# Experiments behind docs/report.md (make report). They run in their own data subtree and log their
# trials to a private inbox, because they test the method, not research ideas.
experiments:
  subtree: backtest-orchestrator/experiments
  ledger_inbox_subdir: backtest-orchestrator/experiments/ledger-inbox
  seeds: [101, 102, 103, 104, 105, 106, 107, 108]
  n_bars: 1560                        # three MOEX main sessions
  strategies: [sma_cross, limit_mean_reversion]
  # Faults planted in a copy of a run to test the parity detectors (E5).
  fault_fee_bps: 2.0                  # extra fee rate on every fill
  fault_price_ticks: 3                # adverse price error on a share of fills
  fault_share: 0.1                    # share of fills hit by the price error or dropped
