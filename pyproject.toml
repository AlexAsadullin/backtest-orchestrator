[project]
name = "bt-orchestrator"
version = "0.1.0"
description = "Multi-fidelity backtest orchestrator with reality-calibrated fills, cross-engine parity and automatic trial logging (Tradeq I5)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Alex Asadullin" }]
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "numba==0.68.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "structlog==26.1.0",
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "vectorbt==1.2.0",
    "nautilus-trader==1.231.0",
    "hftbacktest==2.4.2",
]

[project.scripts]
bt = "bt_orchestrator.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.5",
    "respx==0.23.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt_orchestrator"]


