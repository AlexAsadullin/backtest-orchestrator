[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["bt_orchestrator"]
plugins = ["pydantic.mypy"]

# These engines and numerical libraries ship without type information (no py.typed / no stubs
# in constraints.txt). Their boundaries are wrapped in typed adapters inside this package.
[[tool.mypy.overrides]]
module = [
    "vectorbt.*",
    "nautilus_trader.*",
    "hftbacktest.*",
    "numba.*",
    "pandas.*",
    "pyarrow.*",
    "sklearn.*",
    "scipy.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not live and not integration'"
markers = [
    "live: requires running sibling services or network (skipped by default)",
    "integration: starts the real I2 and S6 services from their sibling repos (make integration)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bt_orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
